
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Forecast App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

<div class="container py-5">

    <div class="weather-container">

        <h1 class="text-center mb-4">Weather Forecast</h1>

        <p class="text-center text-muted">
            Check the weather conditions of any city
        </p>

        <!-- Search Section -->
        <form id="weatherForm" class="input-group mb-4">

            <input type="text"
                   id="cityInput"
                   class="form-control"
                   placeholder="Enter city name..."
                   required>

            <button class="btn btn-primary" type="submit">
                Search
            </button>

        </form>

        <!-- Loading -->
        <div id="loading" class="text-center d-none">
            <div class="spinner-border text-primary"></div>
            <p>Fetching weather data...</p>
        </div>

        <!-- Error -->
        <div id="errorMessage"
             class="alert alert-danger d-none">
        </div>

        <!-- Current Weather -->
        <div id="weatherSection" class="d-none">

            <div class="text-center current-weather">

                <h2 id="cityName"></h2>

                <img id="weatherIcon" src="" alt="Weather icon">

                <h1>
                    <span id="temperature"></span>°C
                </h1>

                <h4 id="description"></h4>

                <p id="dateTime" class="text-muted"></p>

            </div>

            <hr>

            <!-- Weather Details -->
            <div class="row text-center">

                <div class="col-6 col-md-3">
                    <h6>Feels Like</h6>
                    <p id="feelsLike"></p>
                </div>

                <div class="col-6 col-md-3">
                    <h6>Humidity</h6>
                    <p id="humidity"></p>
                </div>

                <div class="col-6 col-md-3">
                    <h6>Wind Speed</h6>
                    <p id="windSpeed"></p>
                </div>

                <div class="col-6 col-md-3">
                    <h6>Pressure</h6>
                    <p id="pressure"></p>
                </div>

            </div>

            <hr>

            <!-- Five Day Forecast -->
            <h3 class="text-center mb-4">
                5-Day Weather Forecast
            </h3>

            <div class="row g-3" id="forecastContainer">

            </div>

        </div>

    </div>

</div>

</body>

<!-- AI Weather Assistant -->
<section class="chatbot-section">
    <div class="chatbot-header">
        <div>
            <h2>Weather AI Assistant</h2>
            <p>Ask me anything about weather!</p>
        </div>
        <span class="bot-icon">🤖</span>
    </div>

    <div id="chatMessages" class="chat-messages">
        <div class="bot-message">
            Hello! 👋 I'm your Weather AI Assistant.
            Ask me anything about weather or forecasts!
        </div>
    </div>

    <div class="chat-input-area">
        <input
            type="text"
            id="chatInput"
            placeholder="Ask me something..."
            autocomplete="off"
        >

        <button id="sendChatBtn" type="button">
            Send
        </button>
    </div>
</section>

</html>
